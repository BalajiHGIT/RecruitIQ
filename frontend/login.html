
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | RecruitIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

<header class="login-brand">
    <div class="brand-mark">RI</div>
    <div>
        <h1>RecruitIQ</h1>
        <p>Recruitment & Placement Management System</p>
    </div>
</header>

<main class="login-main">
    <div class="page-heading">
        <p class="eyebrow">PLACEMENT PORTAL</p>
        <h1>Sign In</h1>
        <p>Login to your placement management workspace.</p>
    </div>

    <section class="panel narrow">
        <h2>Welcome back</h2>

        <form id="loginForm">
            <label>Email address</label>
            <input
                type="email"
                id="email"
                placeholder="admin@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Sign In</button>

            <p id="message" class="muted"></p>
        </form>
    </section>
</main>

<footer class="footer">
    RecruitIQ · Recruitment & Placement Management System
</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
            window.location.href = "/";
        } else {
            message.textContent = result.message;
        }
    } catch (error) {
        message.textContent = "Unable to connect to server.";
    }
});
</script>

</body>
</html>
